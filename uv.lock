[[package]]
name = "wigglecam"
version = "0.4.2"
source = { editable = "." }

[package.optional-dependencies]
demohub = [
    { name = "opencv-python" },
]
node = [
    { name = "opencv-python-headless" },
    { name = "pillow" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pynng" },
]

[package.dev-dependencies]
dev = [
    { name = "basedpyright" },
    { name = "coverage" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.12'" },
    { name = "numpy", version = "2.5.4", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "poethepoet" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-benchmark", extra = ["histogram"] },
    { name = "pytest-cov" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "opencv-python", marker = "extra == 'demohub'", specifier = "~=5.0.0" },
    { name = "opencv-python-headless", marker = "extra == 'node'", specifier = "~=5.0.0" },
    { name = "pillow", marker = "extra == 'node'", specifier = ">=12.1.1" },
    { name = "pydantic", marker = "extra == 'node'" },
    { name = "pydantic-settings", marker = "extra == 'node'" },
    { name = "pynng", marker = "extra == 'node'" },
]
provides-extras = ["node", "demohub"]

[package.metadata.requires-dev]
dev = [
    { name = "basedpyright" },
    { name = "coverage", extras = ["toml"] },
    { name = "numpy" },
    { name = "poethepoet" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-benchmark" },
    { name = "pytest-benchmark", extras = ["histogram"], specifier = ">=5.1.0" },
    { name = "pytest-cov" },
    { name = "ruff" },
]

