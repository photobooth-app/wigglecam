name: lint
permissions:
  contents: read
  
on: 
  [push, pull_request]


jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true

      - name: install the picamera2 prereqisites
        run: |
          sudo apt install -y build-essential libcap-dev


      - name: install the project
        run: |
          uv add picamera2 # install from pypi in hosted env for proper linting.
          uv sync --all-extras --dev
          
      - name: Run linter
        run: |
          uv run poe lint
      